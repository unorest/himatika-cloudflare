<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Internal — HIMATIKA Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body class="bg-gray-100 font-sans" x-data="schedulesApp()" x-init="init()">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-lg flex flex-col flex-shrink-0">
      <div class="px-6 py-5 border-b border-gray-100">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center">
            <span class="text-white font-bold text-sm">H</span>
          </div>
          <div>
            <div class="font-bold text-gray-800 text-sm">HIMATIKA</div>
            <div class="text-xs text-gray-400">Admin Panel</div>
          </div>
        </div>
      </div>
      <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto">
        <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 font-medium text-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7h18M3 12h18M3 17h18"/></svg>
          Dashboard
        </a>
        <a href="posts.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 font-medium text-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Artikel / Blog
        </a>
        <a href="forum.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium text-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
          Moderasi Forum
        </a>
        <a href="tasks.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium text-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          Papan Kanban
        </a>
        <a href="work-programs.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 hover:text-gray-900 font-medium text-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          Program Kerja
        </a>
        <a href="schedules.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-50 text-blue-700 font-medium text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Jadwal Internal
        </a>
      </nav>
      <div class="px-4 py-4 border-t border-gray-100">
        <button @click="logout" class="flex items-center gap-2 text-sm text-red-500 hover:text-red-700 transition px-3 py-2 rounded-lg hover:bg-red-50 w-full">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Keluar
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between flex-shrink-0">
        <div>
          <h1 class="text-lg font-semibold text-gray-800">Kalender & Agenda Internal</h1>
          <p class="text-xs text-gray-400">Jadwal rapat divisi, kepengurusan, dan timeline kegiatan</p>
        </div>
        <div class="flex items-center gap-3">
          <button @click="showModal = true" class="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Tambah Agenda
          </button>
          <div class="w-9 h-9 bg-blue-100 rounded-full flex items-center justify-center">
            <span class="text-blue-700 font-semibold text-sm" x-text="(user.name || 'A').charAt(0).toUpperCase()"></span>
          </div>
        </div>
      </header>

      <!-- Scrollable Content -->
      <main class="flex-1 overflow-y-auto p-6">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
          <div id="calendar" class="min-h-[600px]"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal Detail Agenda -->
  <div x-show="showDetail" class="fixed inset-0 z-50 overflow-y-auto bg-black bg-opacity-40 flex items-center justify-center p-4" x-cloak>
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden animate-fade-in" @click.away="showDetail = false">
      <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
        <h3 class="font-semibold text-gray-800">Detail Agenda</h3>
        <button @click="showDetail = false" class="text-gray-400 hover:text-gray-600">&times;</button>
      </div>
      <div class="p-6 space-y-3">
        <div>
          <span class="text-xs font-semibold text-blue-600 uppercase" x-text="activeEvent?.extendedProps?.division_name || 'Seluruh Pengurus'"></span>
          <h2 class="text-lg font-bold text-gray-800 mt-1" x-text="activeEvent?.title"></h2>
        </div>
        <div class="text-sm text-gray-600 space-y-1.5 pt-2 border-t border-gray-100">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span x-text="formatEventTime(activeEvent)"></span>
          </div>
          <div class="flex items-center gap-2" x-show="activeEvent?.extendedProps?.location">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
            <span x-text="activeEvent?.extendedProps?.location"></span>
          </div>
        </div>
        <div class="pt-4 flex justify-end">
          <button @click="showDetail = false" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Tambah Agenda -->
  <div x-show="showModal" class="fixed inset-0 z-50 overflow-y-auto bg-black bg-opacity-40 flex items-center justify-center p-4" x-cloak>
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden animate-fade-in" @click.away="showModal = false">
      <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
        <h3 class="font-semibold text-gray-800">Tambah Agenda Internal Baru</h3>
        <button @click="showModal = false" class="text-gray-400 hover:text-gray-600">&times;</button>
      </div>
      <form @submit.prevent="saveEvent" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Nama Agenda *</label>
          <input type="text" x-model="newEvent.title" required class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Rapat Pleno Bulanan">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Mulai *</label>
            <input type="datetime-local" x-model="newEvent.start" required class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Selesai *</label>
            <input type="datetime-local" x-model="newEvent.end" required class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Lokasi / Link Pertemuan</label>
          <input type="text" x-model="newEvent.location" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ruang Rapat 2 / Google Meet">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Warna Label</label>
          <select x-model="newEvent.color" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="#3B82F6">Biru (Umum)</option>
            <option value="#10B981">Hijau (Akademik)</option>
            <option value="#F59E0B">Oranye (Minat Bakat)</option>
            <option value="#EF4444">Merah (Penting)</option>
            <option value="#8B5CF6">Ungu (Internal)</option>
          </select>
        </div>
        <div class="flex justify-end gap-3 pt-3 border-t border-gray-100">
          <button type="button" @click="showModal = false" class="px-4 py-2 border border-gray-200 text-gray-600 rounded-lg text-sm hover:bg-gray-50">Batal</button>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">Simpan Agenda</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8787';

    function schedulesApp() {
      return {
        user: {},
        calendar: null,
        showDetail: false,
        showModal: false,
        activeEvent: null,
        newEvent: { title: '', start: '', end: '', location: '', color: '#3B82F6' },

        async init() {
          const token = localStorage.getItem('hmt_token');
          if (!token) { window.location.href = '/admin/login.html'; return; }
          try { this.user = JSON.parse(localStorage.getItem('hmt_user') || '{}'); } catch {}

          this.$nextTick(() => this.initCalendar());
        },

        initCalendar() {
          const calendarEl = document.getElementById('calendar');
          if (!calendarEl) return;

          const token = localStorage.getItem('hmt_token');
          this.calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
              left: 'prev,next today',
              center: 'title',
              right: 'dayGridMonth,timeGridWeek,listWeek'
            },
            locale: 'id',
            buttonText: { today: 'Hari ini', month: 'Bulan', week: 'Minggu', list: 'Daftar' },
            events: async (info, successCallback, failureCallback) => {
              try {
                const res = await fetch(`${API_BASE}/admin/schedules/api?start=${info.startStr}&end=${info.endStr}`, {
                  headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json();
                successCallback(Array.isArray(data) ? data : []);
              } catch (e) {
                failureCallback(e);
              }
            },
            eventClick: (info) => {
              this.activeEvent = info.event;
              this.showDetail = true;
            }
          });

          this.calendar.render();
        },

        formatEventTime(ev) {
          if (!ev || !ev.start) return '';
          const s = new Date(ev.start).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
          if (ev.end) {
            const e = new Date(ev.end).toLocaleTimeString('id-ID', { timeStyle: 'short' });
            return `${s} - ${e}`;
          }
          return s;
        },

        saveEvent() {
          alert('Agenda berhasil ditambahkan!');
          this.calendar.addEvent({
            title: this.newEvent.title,
            start: this.newEvent.start,
            end: this.newEvent.end,
            backgroundColor: this.newEvent.color,
            borderColor: this.newEvent.color,
            extendedProps: { location: this.newEvent.location }
          });
          this.showModal = false;
          this.newEvent = { title: '', start: '', end: '', location: '', color: '#3B82F6' };
        },

        logout() {
          localStorage.removeItem('hmt_token');
          localStorage.removeItem('hmt_user');
          window.location.href = '/admin/login.html';
        },
      };
    }
  </script>
</body>
</html>
