<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — HIMATIKA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div x-data="loginApp()" class="w-full max-w-md px-4">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg">
        <span class="text-white text-2xl font-bold">H</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">HIMATIKA Admin</h1>
      <p class="text-gray-500 text-sm mt-1">Himpunan Mahasiswa Matematika</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h2 class="text-xl font-semibold text-gray-700 mb-6">Masuk ke Dashboard</h2>

      <!-- Error Alert -->
      <div x-show="error" x-transition class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-5 flex items-center gap-2 text-sm">
        <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span x-text="error"></span>
      </div>

      <form @submit.prevent="login">
        <!-- Email -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input
            type="email"
            x-model="form.email"
            placeholder="admin@himatika.id"
            required
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          />
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <div class="relative">
            <input
              :type="showPass ? 'text' : 'password'"
              x-model="form.password"
              placeholder="••••••••"
              required
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition pr-10"
            />
            <button type="button" @click="showPass = !showPass" class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600">
              <svg x-show="!showPass" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg x-show="showPass" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          :disabled="loading"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2"
        >
          <svg x-show="loading" class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span x-text="loading ? 'Memproses...' : 'Masuk'"></span>
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">© 2025 HIMATIKA — Panel Admin</p>
  </div>

  <script>
    const API_BASE = 'http://localhost:8787';

    function loginApp() {
      return {
        form: { email: '', password: '' },
        loading: false,
        error: '',
        showPass: false,

        async login() {
          this.error = '';
          this.loading = true;
          try {
            const res = await fetch(`${API_BASE}/admin/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.form),
            });
            const data = await res.json();
            if (!res.ok) {
              this.error = data.message || 'Email atau password salah.';
              return;
            }
            localStorage.setItem('hmt_token', data.token);
            localStorage.setItem('hmt_user', JSON.stringify(data.user));
            window.location.href = '/admin/dashboard.html';
          } catch (e) {
            this.error = 'Gagal terhubung ke server. Coba lagi.';
          } finally {
            this.loading = false;
          }
        },

        init() {
          if (localStorage.getItem('hmt_token')) {
            window.location.href = '/admin/dashboard.html';
          }
        }
      };
    }
  </script>
</body>
</html>
