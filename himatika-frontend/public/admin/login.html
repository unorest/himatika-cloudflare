<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Pengurus — HIMATIKA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/js/api.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-indigo-950 min-h-screen flex items-center justify-center p-4 font-sans">

  <div x-data="loginApp()" x-init="init()" class="w-full max-w-md">
    <!-- Header Brand -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-3 shadow-lg shadow-blue-500/30 ring-4 ring-blue-500/20">
        <span class="text-white text-2xl font-black tracking-wider">H</span>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">HIMATIKA</h1>
      <p class="text-blue-200/70 text-xs mt-0.5">Sistem Informasi Pengurus & Organisasi Mahasiswa</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-white/20">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 class="text-lg font-bold text-gray-900">Masuk Akun</h2>
          <p class="text-xs text-gray-500">Gunakan Email atau NIM terdaftar</p>
        </div>
        <!-- Status Server API -->
        <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium"
             :class="apiOnline ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'">
          <span class="w-2 h-2 rounded-full" :class="apiOnline ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'"></span>
          <span x-text="apiOnline ? 'API Online' : 'Cek API...'"></span>
        </div>
      </div>

      <!-- Error Alert -->
      <div x-show="error" x-transition.opacity class="bg-rose-50 border border-rose-200 text-rose-700 rounded-xl px-4 py-3 mb-5 flex items-start gap-2.5 text-xs">
        <svg class="w-4 h-4 text-rose-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="flex-1 font-medium" x-text="error"></span>
      </div>

      <form @submit.prevent="login" class="space-y-4">
        <!-- Email / NIM Input -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">Email atau NIM</label>
          <div class="relative">
            <input
              type="text"
              x-model="form.identifier"
              placeholder="rabiah@himatika.org / 240401010065"
              required
              class="w-full pl-10 pr-4 py-2.5 bg-gray-50/50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
            />
            <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
            </svg>
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold text-gray-700">Kata Sandi</label>
            <span class="text-[11px] text-gray-400">Default: <span class="font-mono font-medium text-gray-600">admin123</span></span>
          </div>
          <div class="relative">
            <input
              :type="showPass ? 'text' : 'password'"
              x-model="form.password"
              placeholder="••••••••"
              required
              class="w-full pl-10 pr-10 py-2.5 bg-gray-50/50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
            />
            <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <button type="button" @click="showPass = !showPass" class="absolute inset-y-0 right-3.5 flex items-center text-gray-400 hover:text-gray-600 transition">
              <svg x-show="!showPass" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg x-show="showPass" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Ingat Saya -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" x-model="rememberMe" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-gray-300">
            <span class="text-xs text-gray-600">Ingat sesi saya</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          :disabled="loading"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-3 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30 hover:shadow-blue-600/50 mt-2"
        >
          <svg x-show="loading" class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span x-text="loading ? 'Memverifikasi...' : 'Masuk ke Dashboard'"></span>
        </button>
      </form>

      <!-- Quick Pengurus Picker -->
      <div class="mt-6 pt-5 border-t border-gray-100">
        <button
          type="button"
          @click="showModalPengurus = true"
          class="w-full py-2.5 px-3 bg-blue-50 hover:bg-blue-100/80 text-blue-700 font-semibold text-xs rounded-xl transition flex items-center justify-center gap-2 border border-blue-200"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          📋 Pilih dari 21 Akun Pengurus
        </button>
      </div>
    </div>

    <!-- Footer Links -->
    <div class="flex items-center justify-between mt-6 px-2 text-xs text-blue-200/60">
      <a href="/" class="hover:text-white transition flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Kembali ke Beranda
      </a>
      <span>© 2025 HIMATIKA</span>
    </div>

    <!-- Modal Daftar 21 Pengurus -->
    <div x-show="showModalPengurus" class="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
      <div class="bg-white rounded-3xl shadow-2xl w-full max-w-xl max-h-[85vh] flex flex-col overflow-hidden animate-fade-in" @click.away="showModalPengurus = false">
        <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
          <div>
            <h3 class="font-bold text-gray-800 text-sm">Daftar Akun Pengurus HIMATIKA</h3>
            <p class="text-[11px] text-gray-500">Pilih salah satu pengurus untuk otomatis mengisi form login</p>
          </div>
          <button @click="showModalPengurus = false" class="text-gray-400 hover:text-gray-600 text-lg font-bold">&times;</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
          <template x-for="divisi in listDivisi" :key="divisi.nama">
            <div>
              <div class="font-bold text-blue-700 bg-blue-50/80 px-3 py-1.5 rounded-lg mb-2 flex items-center justify-between">
                <span x-text="divisi.nama"></span>
                <span class="text-[10px] text-blue-500 font-normal" x-text="divisi.anggota.length + ' Orang'"></span>
              </div>
              <div class="space-y-1.5">
                <template x-for="p in divisi.anggota" :key="p.email">
                  <div
                    @click="pilihAkun(p)"
                    class="p-2.5 rounded-xl border border-gray-100 hover:border-blue-300 hover:bg-blue-50/50 cursor-pointer transition flex items-center justify-between"
                  >
                    <div>
                      <div class="font-semibold text-gray-800" x-text="p.nama"></div>
                      <div class="text-[11px] text-gray-500 flex items-center gap-2 mt-0.5">
                        <span x-text="p.jabatan" class="text-blue-600 font-medium"></span>
                        <span>•</span>
                        <span class="font-mono" x-text="p.nim"></span>
                      </div>
                    </div>
                    <div class="text-right">
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase"
                            :class="p.role === 'admin' ? 'bg-purple-100 text-purple-700' : (p.role === 'kadiv' ? 'bg-amber-100 text-amber-800' : 'bg-gray-100 text-gray-600')"
                            x-text="p.role"></span>
                      <div class="text-[10px] text-blue-600 mt-1 font-medium">Pilih Akun →</div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <div class="p-3 border-t border-gray-100 bg-gray-50 text-right">
          <button @click="showModalPengurus = false" class="px-4 py-1.5 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-xs font-medium">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function loginApp() {
      return {
        form: { identifier: 'rabiah@himatika.org', password: 'admin123' },
        loading: false,
        error: '',
        showPass: false,
        rememberMe: true,
        apiOnline: false,
        showModalPengurus: false,

        listDivisi: [
          {
            nama: 'Badan Pengurus Harian (BPH)',
            anggota: [
              { nama: 'Rabiah Al-Adawiyah', jabatan: 'Ketua', role: 'admin', email: 'rabiah@himatika.org', nim: '240401010065' },
              { nama: 'Samuel Binsar Aditya Simamora', jabatan: 'Wakil Ketua', role: 'admin', email: 'samuel@himatika.org', nim: '240401010275' },
              { nama: 'Vina Lestari', jabatan: 'Sekretaris 1', role: 'staff', email: 'vina@himatika.org', nim: '240401010385' },
              { nama: 'Nadin Nadilah', jabatan: 'Sekretaris 2', role: 'staff', email: 'nadin@himatika.org', nim: '260401071001' },
              { nama: 'Dian Avila', jabatan: 'Bendahara', role: 'staff', email: 'dian@himatika.org', nim: '250401010377' },
            ]
          },
          {
            nama: 'Divisi Stupport',
            anggota: [
              { nama: 'M. Rendy Amril', jabatan: 'Ketua Stupport', role: 'kadiv', email: 'rendy@himatika.org', nim: '240401010288' },
              { nama: 'Hikmah Indriyani', jabatan: 'Anggota Stupport', role: 'staff', email: 'hikmah@himatika.org', nim: '250401010395' },
              { nama: 'M. Naufal Adzim Ramadhan', jabatan: 'Anggota Stupport', role: 'staff', email: 'naufal@himatika.org', nim: '260401630042' },
              { nama: 'Linawati', jabatan: 'Anggota Stupport', role: 'staff', email: 'linawati@himatika.org', nim: '260401010228' },
            ]
          },
          {
            nama: 'Divisi PDD',
            anggota: [
              { nama: 'Intan Puji Hirdian', jabatan: 'Ketua PDD', role: 'kadiv', email: 'intan@himatika.org', nim: '250401010210' },
              { nama: 'Ratu Bilqis Mantika RO', jabatan: 'Anggota PDD', role: 'staff', email: 'balqis@himatika.org', nim: '240401020203' },
              { nama: 'Triyas Apritantina', jabatan: 'Anggota PDD', role: 'staff', email: 'triyas@himatika.org', nim: '260401010208' },
            ]
          },
          {
            nama: 'Divisi PSDM',
            anggota: [
              { nama: 'Cut Evelyn Anwar', jabatan: 'Ketua PSDM', role: 'kadiv', email: 'cut.evelyn@himatika.org', nim: '250401010442' },
              { nama: 'Arsita Rahmawati Dewi', jabatan: 'Anggota PSDM', role: 'staff', email: 'arsita@himatika.org', nim: '240401010318' },
              { nama: 'M. Dzaky Ghaly Ramdhani', jabatan: 'Anggota PSDM', role: 'staff', email: 'dzaky@himatika.org', nim: '260401010316' },
              { nama: 'Johan Sudanta Hla', jabatan: 'Anggota PSDM', role: 'staff', email: 'johan@himatika.org', nim: '260401630027' },
              { nama: 'Risma Diah Wulandari', jabatan: 'Anggota PSDM', role: 'staff', email: 'risma@himatika.org', nim: '260401010315' },
            ]
          },
          {
            nama: 'Divisi Intellogy',
            anggota: [
              { nama: 'Raden Dimas Taufik Rahmat', jabatan: 'Ketua Intellogy', role: 'kadiv', email: 'dimas@himatika.org', nim: '250401010460' },
              { nama: 'Fajar Mauludin', jabatan: 'Anggota Intellogy', role: 'staff', email: 'fajar@himatika.org', nim: '260401010227' },
              { nama: 'Mochammad Wahyu R', jabatan: 'Anggota Intellogy', role: 'staff', email: 'wahyu@himatika.org', nim: '260401630016' },
              { nama: 'Chandra Handika', jabatan: 'Anggota Intellogy', role: 'staff', email: 'chandra@himatika.org', nim: '260401010340' },
            ]
          }
        ],

        async init() {
          if (localStorage.getItem('hmt_token')) {
            window.location.href = '/admin/dashboard.html';
            return;
          }

          try {
            const base = typeof getApiBase === 'function' ? getApiBase() : (window.API_BASE || 'http://localhost:8787');
            const res = await fetch(`${base}/`);
            if (res.ok) this.apiOnline = true;
          } catch (e) {
            this.apiOnline = false;
          }
        },

        pilihAkun(p) {
          this.form.identifier = p.email;
          this.form.password = 'admin123';
          this.showModalPengurus = false;
        },

        async login() {
          this.error = '';
          this.loading = true;

          try {
            const base = typeof getApiBase === 'function' ? getApiBase() : (window.API_BASE || 'http://localhost:8787');
            const res = await fetch(`${base}/admin/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                identifier: this.form.identifier,
                email: this.form.identifier,
                nim: this.form.identifier,
                password: this.form.password,
              }),
            });

            const data = await res.json();

            if (!res.ok || !data.success) {
              this.error = data.message || 'Email/NIM atau kata sandi tidak sesuai.';
              return;
            }

            const payload = data.data || data;
            const token = payload.token || data.token;
            const user = payload.user || data.user;

            if (token) {
              localStorage.setItem('hmt_token', token);
              localStorage.setItem('hmt_user', JSON.stringify(user || {}));
              window.location.href = '/admin/dashboard.html';
            } else {
              this.error = 'Respon server tidak memiliki token.';
            }
          } catch (err) {
            console.error('Login error:', err);
            this.error = 'Gagal menghubungi server API. Pastikan Worker (port 8787) sedang berjalan.';
          } finally {
            this.loading = false;
          }
        }
      };
    }
  </script>
</body>
</html>
