<!DOCTYPE html>
<html lang="id" x-data="eventPage()" x-init="init()">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event - HIMATIKA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FullCalendar CDN -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="/js/api.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .fc .fc-toolbar-title { font-size: 1.1rem; font-weight: 700; }
    .fc .fc-button { background: #2563eb; border-color: #2563eb; }
    .fc .fc-button:hover { background: #1d4ed8; }
    .fc .fc-button-primary:not(:disabled).fc-button-active { background: #1e40af; }
    .fc-event { cursor: pointer; }
  </style>
</head>
<body class="bg-gray-50 font-sans">

  <!-- NAVBAR -->
  <nav class="bg-white shadow-sm sticky top-0 z-50" x-data="{ open: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <a href="/" class="text-2xl font-bold text-blue-700 tracking-tight">HIMATIKA</a>
        <div class="hidden md:flex items-center space-x-6">
          <a href="/" class="text-gray-600 hover:text-blue-700 transition">Beranda</a>
          <a href="/blog/" class="text-gray-600 hover:text-blue-700 transition">Blog</a>
          <a href="/event/" class="text-blue-700 font-semibold border-b-2 border-blue-700 pb-0.5">Event</a>
          <a href="/forum/" class="text-gray-600 hover:text-blue-700 transition">Forum</a>
          <a href="/admin/login.html" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm shadow-blue-500/20 transition ml-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
            Login Admin
          </a>
        </div>
        <button @click="open = !open" class="md:hidden p-2 rounded text-gray-600 hover:bg-gray-100">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path x-show="!open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            <path x-show="open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
    <div x-show="open" x-transition class="md:hidden bg-white border-t border-gray-100 px-4 py-3 space-y-2">
      <a href="/" class="block text-gray-700 py-1">Beranda</a>
      <a href="/blog/" class="block text-gray-700 py-1">Blog</a>
      <a href="/event/" class="block text-blue-700 font-semibold py-1">Event</a>
      <a href="/forum/" class="block text-gray-700 py-1">Forum</a>
      <a href="/admin/login.html" class="inline-flex items-center justify-center gap-2 w-full mt-2 px-4 py-2.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
        Login Admin
      </a>
    </div>
  </nav>

  <!-- HEADER -->
  <div class="bg-gradient-to-r from-blue-700 to-indigo-700 text-white py-12 px-4">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-3xl md:text-4xl font-bold mb-2">Event HIMATIKA</h1>
      <p class="text-blue-200">Jadwal kegiatan dan event dari Himpunan Mahasiswa Matematika.</p>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-10">

    <!-- Loading -->
    <div x-show="loading" class="flex justify-center py-16">
      <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div x-show="!loading">
      <!-- FullCalendar -->
      <div class="bg-white rounded-xl shadow p-4 md:p-6 mb-10">
        <div id="calendar"></div>
      </div>

      <!-- Upcoming Events List -->
      <h2 class="text-xl font-bold text-gray-800 mb-6">📅 Event Mendatang</h2>

      <template x-if="upcomingEvents.length === 0">
        <div class="text-center py-12 text-gray-400">
          <svg class="w-16 h-16 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <p>Tidak ada event mendatang.</p>
        </div>
      </template>

      <div class="space-y-4">
        <template x-for="ev in upcomingEvents" :key="ev.id">
          <div class="bg-white rounded-xl shadow hover:shadow-md transition p-5 flex flex-col md:flex-row md:items-center gap-4">
            <!-- Date Badge -->
            <div class="flex-shrink-0 text-center bg-blue-600 text-white rounded-xl px-5 py-3 w-20 mx-auto md:mx-0">
              <div class="text-xs font-semibold uppercase" x-text="monthStr(ev.start_date || ev.date)"></div>
              <div class="text-2xl font-extrabold" x-text="dayStr(ev.start_date || ev.date)"></div>
            </div>

            <!-- Info -->
            <div class="flex-1 min-w-0">
              <div class="flex flex-wrap items-center gap-2 mb-1">
                <h3 class="font-bold text-gray-800 text-lg" x-text="ev.title || ev.name"></h3>
                <span class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-2 py-0.5 rounded-full" x-text="ev.division || ev.divisi || 'Umum'"></span>
              </div>
              <div class="flex flex-wrap gap-4 text-sm text-gray-500">
                <span class="flex items-center gap-1">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
                  <span x-text="ev.location || 'TBA'"></span>
                </span>
                <span class="flex items-center gap-1">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  <span x-text="ev.time || formatTime(ev.start_date || ev.date)"></span>
                </span>
              </div>
              <p class="text-gray-500 text-sm mt-1 line-clamp-2" x-text="ev.description || ''"></p>
            </div>

            <!-- Register Button -->
            <div class="flex-shrink-0 text-center md:text-right">
              <a x-show="ev.allow_registration"
                :href="`/event/daftar.html?slug=${ev.slug}`"
                class="inline-block bg-blue-600 text-white font-semibold px-5 py-2 rounded-full hover:bg-blue-700 transition text-sm">
                Daftar
              </a>
              <span x-show="!ev.allow_registration" class="text-xs text-gray-400">Pendaftaran ditutup</span>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>

  <!-- Event Detail Modal -->
  <div x-show="selectedEvent" x-transition class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 px-4" @click.self="selectedEvent = null">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6" x-show="selectedEvent">
      <div class="flex justify-between items-start mb-4">
        <h2 class="text-xl font-bold text-gray-800" x-text="selectedEvent?.title"></h2>
        <button @click="selectedEvent = null" class="text-gray-400 hover:text-gray-600 ml-4">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="space-y-2 text-sm text-gray-600">
        <p><span class="font-semibold">Tanggal:</span> <span x-text="formatDate(selectedEvent?.start)"></span></p>
        <p><span class="font-semibold">Lokasi:</span> <span x-text="selectedEvent?.extendedProps?.location || 'TBA'"></span></p>
        <p><span class="font-semibold">Divisi:</span> <span x-text="selectedEvent?.extendedProps?.division || 'Umum'"></span></p>
        <p x-show="selectedEvent?.extendedProps?.description" x-text="selectedEvent?.extendedProps?.description"></p>
      </div>
      <div class="mt-5" x-show="selectedEvent?.extendedProps?.allow_registration">
        <a :href="`/event/daftar.html?slug=${selectedEvent?.extendedProps?.slug}`"
          class="block text-center bg-blue-600 text-white font-semibold py-2.5 rounded-full hover:bg-blue-700 transition">
          Daftar Sekarang
        </a>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-blue-800 text-white py-8 mt-12">
    <div class="max-w-7xl mx-auto px-4 text-center text-blue-200 text-sm">
      © <span x-text="new Date().getFullYear()"></span> HIMATIKA — Himpunan Mahasiswa Matematika
    </div>
  </footer>

  <script>
    function eventPage() {
      return {
        events: [],
        loading: true,
        selectedEvent: null,
        calendar: null,

        get upcomingEvents() {
          const now = new Date();
          return this.events
            .filter(e => new Date(e.start_date || e.date || e.start) >= now)
            .sort((a, b) => new Date(a.start_date || a.date) - new Date(b.start_date || b.date));
        },

        async init() {
          try {
            const data = await api.get('/event');
            this.events = Array.isArray(data) ? data : (data.data || data.events || []);
          } catch(e) {
            this.events = [];
          } finally {
            this.loading = false;
            this.$nextTick(() => this.initCalendar());
          }
        },

        initCalendar() {
          const el = document.getElementById('calendar');
          if (!el || typeof FullCalendar === 'undefined') return;

          const fcEvents = this.events.map(ev => ({
            id: ev.id,
            title: ev.title || ev.name,
            start: ev.start_date || ev.date || ev.start,
            end: ev.end_date || ev.end,
            backgroundColor: '#2563eb',
            borderColor: '#1d4ed8',
            extendedProps: {
              location: ev.location,
              division: ev.division || ev.divisi,
              description: ev.description,
              allow_registration: ev.allow_registration,
              slug: ev.slug,
            }
          }));

          this.calendar = new FullCalendar.Calendar(el, {
            initialView: 'dayGridMonth',
            locale: 'id',
            headerToolbar: {
              left: 'prev,next today',
              center: 'title',
              right: 'dayGridMonth,listWeek'
            },
            events: fcEvents,
            eventClick: (info) => {
              this.selectedEvent = info.event;
            },
          });
          this.calendar.render();
        },

        formatDate(str) {
          if (!str) return '-';
          return new Date(str).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        },

        formatTime(str) {
          if (!str) return '-';
          return new Date(str).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        },

        monthStr(str) {
          if (!str) return '';
          return new Date(str).toLocaleDateString('id-ID', { month: 'short' });
        },

        dayStr(str) {
          if (!str) return '';
          return new Date(str).getDate();
        },
      };
    }
  </script>
</body>
</html>
