<!-- ============================================================
     navbar-admin.html — Navbar + Sidebar dashboard admin HIMATIKA
     Requires: Alpine.js, Tailwind CSS, auth.js (Alpine store: auth)
     Usage: copy/paste atau include via fetch + innerHTML
     ============================================================ -->

<!-- Top Navbar -->
<header
  x-data="{ notifOpen: false, userOpen: false }"
  class="fixed top-0 left-0 right-0 h-16 bg-white border-b border-gray-200 shadow-sm z-40 flex items-center px-4 md:pl-72"
>
  <!-- Logo (mobile only, hidden on md+) -->
  <a href="/admin/dashboard.html"
     class="md:hidden flex items-center gap-2 mr-auto">
    <div class="w-7 h-7 bg-blue-600 rounded-md flex items-center justify-center">
      <span class="text-white font-bold text-xs">H</span>
    </div>
    <span class="font-extrabold text-blue-700 text-base">HIMATIKA</span>
  </a>

  <div class="ml-auto flex items-center gap-3">

    <!-- Notification Bell -->
    <div class="relative" @click.outside="notifOpen = false">
      <button
        @click="notifOpen = !notifOpen"
        class="relative p-2 rounded-lg text-gray-500 hover:bg-gray-100 transition"
        aria-label="Notifikasi"
      >
        <!-- Bell icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <!-- Badge -->
        <span
          x-show="$store.auth.user && $store.auth.user.unread_notif > 0"
          x-text="$store.auth.user ? $store.auth.user.unread_notif : ''"
          class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] flex items-center justify-center
                 bg-red-500 text-white text-[10px] font-bold rounded-full px-1"
        ></span>
      </button>

      <!-- Notif dropdown -->
      <div
        x-show="notifOpen"
        x-transition
        class="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-xl border border-gray-100 overflow-hidden"
      >
        <div class="px-4 py-3 border-b border-gray-100 font-semibold text-sm text-gray-700">
          Notifikasi
        </div>
        <div class="max-h-64 overflow-y-auto">
          <p class="px-4 py-6 text-sm text-gray-400 text-center">Belum ada notifikasi</p>
        </div>
        <div class="px-4 py-2 border-t border-gray-100 text-center">
          <a href="/admin/notifications.html"
             class="text-xs text-blue-600 hover:underline font-medium">
            Lihat semua
          </a>
        </div>
      </div>
    </div>

    <!-- User Dropdown -->
    <div class="relative" @click.outside="userOpen = false">
      <button
        @click="userOpen = !userOpen"
        class="flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-gray-100 transition"
      >
        <div class="w-7 h-7 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold text-sm">
          <span x-text="$store.auth.user ? $store.auth.user.name[0].toUpperCase() : 'U'">U</span>
        </div>
        <span class="text-sm font-medium text-gray-700 max-w-[120px] truncate hidden sm:block"
              x-text="$store.auth.user ? $store.auth.user.name : 'Admin'">Admin</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <div
        x-show="userOpen"
        x-transition
        class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-gray-100 py-1 overflow-hidden"
      >
        <a href="/admin/profile.html"
           class="flex items-center gap-2 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none"
               viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Profil Saya
        </a>
        <hr class="my-1 border-gray-100">
        <button
          @click="$store.auth.logout()"
          class="w-full flex items-center gap-2 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition text-left"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
               viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Logout
        </button>
      </div>
    </div>

  </div>
</header>

      <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">

  <!-- Footer sidebar -->
